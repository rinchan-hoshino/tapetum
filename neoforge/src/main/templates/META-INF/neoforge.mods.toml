modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"
issueTrackerURL="https://github.com/rinchan-hoshino/tapetum/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
${icon_property}="assets/tapetum/icon.png"
authors="${mod_authors}"
description='''${mod_description}'''

[[mixins]]
config="tapetum.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="sodium"
type="optional"
versionRange="[0.6,)"
ordering="NONE"
side="CLIENT"

[[dependencies.${mod_id}]]
modId="iris"
type="optional"
versionRange="[1.8,)"
ordering="NONE"
side="CLIENT"
