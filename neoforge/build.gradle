plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

def root = rootProject
def modId = root.property('mod_id')
def apiLayer = root.api_layer

base {
    archivesName = "${modId}-neoforge"
}

def localClasspathDir = file('/Users/rin/.rin/Projects/watermelon-field-bulrush/mod-sources/watermelon-field/build/classpath')
def extractedJijDir = layout.buildDirectory.dir('extracted-jij').get().asFile

def extractJij = { String outerJarName, String innerPath, String outName ->
    File outer = new File(localClasspathDir, outerJarName)
    File outFile = new File(extractedJijDir, outName)
    if (outer.exists() && (!outFile.exists() || outFile.lastModified() < outer.lastModified())) {
        extractedJijDir.mkdirs()
        def zf = new java.util.zip.ZipFile(outer)
        try {
            def entry = zf.getEntry(innerPath)
            if (entry != null) {
                zf.getInputStream(entry).withCloseable { ins ->
                    outFile.withOutputStream { outs -> ins.transferTo(outs) }
                }
            }
        } finally {
            zf.close()
        }
    }
    return outFile
}

def modCompileJars = [
    new File(localClasspathDir, 'sodium-neoforge-0.8.13+mc1.21.1.jar'),
    extractJij('sodium-neoforge-0.8.13+mc1.21.1.jar', 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-0.8.13+mc1.21.1-mod.jar', 'sodium-mod.jar'),
    new File(localClasspathDir, 'iris-neoforge-1.8.14-beta.1+mc1.21.1.jar'),
    new File(localClasspathDir, 'geckolib-neoforge-1.21.1-4.9.3.jar'),
    new File(localClasspathDir, 'azurelib-neo-1.21.1-3.2.8.jar'),
    new File(localClasspathDir, 'tacz-neoforge-1.21.1-1.2.0.jar'),
    extractJij('tacz-neoforge-1.21.1-1.2.0.jar', 'META-INF/jarjar/simplebedrockmodel-2.6.2-neoforge-mc1.21.1.jar', 'simplebedrockmodel-v2.jar'),
    new File(localClasspathDir, 'touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar'),
    new File(localClasspathDir, 'SlashBladeResharped-2.1.9-1.21.1.jar'),
    new File(localClasspathDir, 'kaleidoscopedoll-1.4.2-neoforge+mc1.21.1.jar'),
].findAll { it.exists() }

sourceSets.main.java.srcDir root.file('common/src/main/java')
sourceSets.main.java.srcDir root.file("common/src/${apiLayer}/java")
sourceSets.main.resources.srcDir root.file('common/src/main/resources')
sourceSets.main.resources.srcDir root.file("common/src/${apiLayer}/resources")
sourceSets.test.java.srcDir root.file('common/src/test/java')
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath

sourceSets.main.resources.srcDir tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: root.minecraft_version_range,
        neo_version_range      : root.neo_version_range,
        loader_version_range   : root.property('loader_version_range'),
        mod_id                 : modId,
        mod_name               : root.property('mod_name'),
        mod_license            : root.property('mod_license'),
        mod_version            : root.property('mod_version'),
        mod_authors            : root.property('mod_authors'),
        mod_description        : root.property('mod_description'),
        icon_property          : 'logoFile'
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

neoForge {
    version = root.neo_version
    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }
    unitTest {
        enable()
        testedMod = mods."${modId}"
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

neoForge.ideSyncTask tasks.named('generateModMetadata')

dependencies {
    compileOnly files(modCompileJars)
    compileOnly 'com.bawnorton.mixinsquared:mixinsquared-common:0.2.0'
    testImplementation files(modCompileJars)
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def jarArchiveFile = tasks.named('jar').flatMap { it.archiveFile }
def cpDirPath = localClasspathDir.absolutePath
def jijDirPath = extractedJijDir.absolutePath

tasks.named('test', Test) {
    dependsOn tasks.named('jar')
    useJUnitPlatform()
    doFirst {
        systemProperty 'tapetum.packagedJar', jarArchiveFile.get().asFile.absolutePath
        systemProperty 'tapetum.classpathDir', cpDirPath
        systemProperty 'tapetum.extractedJijDir', jijDirPath
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-neoforge"
            from components.java
        }
    }
}
