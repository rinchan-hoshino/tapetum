plugins {
    id 'java-library'
    id 'maven-publish'
    id 'fabric-loom'
}

def root = rootProject
def modId = root.property('mod_id')
def apiLayer = root.api_layer

loom.interfaceInjection.getIsEnabled().set(false)

base {
    archivesName = "${modId}-fabric"
}

def localClasspathDir = file('/Users/rin/.rin/Projects/watermelon-field-bulrush/mod-sources/watermelon-field/build/classpath')
def extractedJijDir = layout.buildDirectory.dir('extracted-jij').get().asFile

def extractJij = { String outerJarName, String innerPath, String outName ->
    File outer = new File(localClasspathDir, outerJarName)
    File outFile = new File(extractedJijDir, outName)
    if (outer.exists() && (!outFile.exists() || outFile.lastModified() < outer.lastModified())) {
        extractedJijDir.mkdirs()
        def zf = new java.util.zip.ZipFile(outer)
        try {
            def entry = zf.getEntry(innerPath)
            if (entry != null) {
                zf.getInputStream(entry).withCloseable { ins ->
                    outFile.withOutputStream { outs -> ins.transferTo(outs) }
                }
            }
        } finally {
            zf.close()
        }
    }
    return outFile
}

def modCompileJars = [
    new File(localClasspathDir, 'sodium-neoforge-0.8.13+mc1.21.1.jar'),
    extractJij('sodium-neoforge-0.8.13+mc1.21.1.jar', 'META-INF/jarjar/net.caffeinemc.sodium-neoforge-0.8.13+mc1.21.1-mod.jar', 'sodium-mod.jar'),
    new File(localClasspathDir, 'iris-neoforge-1.8.14-beta.1+mc1.21.1.jar'),
    new File(localClasspathDir, 'geckolib-neoforge-1.21.1-4.9.3.jar'),
    new File(localClasspathDir, 'azurelib-neo-1.21.1-3.2.8.jar'),
    new File(localClasspathDir, 'tacz-neoforge-1.21.1-1.2.0.jar'),
    extractJij('tacz-neoforge-1.21.1-1.2.0.jar', 'META-INF/jarjar/simplebedrockmodel-2.6.2-neoforge-mc1.21.1.jar', 'simplebedrockmodel-v2.jar'),
    new File(localClasspathDir, 'touhoulittlemaid-1.5.3-neoforge+mc1.21.1.jar'),
    new File(localClasspathDir, 'SlashBladeResharped-2.1.9-1.21.1.jar'),
    new File(localClasspathDir, 'kaleidoscopedoll-1.4.2-neoforge+mc1.21.1.jar'),
].findAll { it.exists() }

sourceSets {
    modmenuStub {
        java.srcDir 'src/modmenuStub/java'
    }
    main {
        java.srcDir root.file('common/src/main/java')
        java.srcDir root.file("common/src/${apiLayer}/java")
        resources.srcDir root.file('common/src/main/resources')
        resources.srcDir root.file("common/src/${apiLayer}/resources")
        compileClasspath += modmenuStub.output
    }
}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName.set("${modId}.refmap.json")
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${root.property('minecraft_version')}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${root.property('fabric_loader_version')}"
    compileOnly "net.fabricmc:sponge-mixin:0.17.3+mixin.0.8.7"
    compileOnly files(modCompileJars)
}

sourceSets.modmenuStub.compileClasspath = configurations.compileClasspath

def resourceProperties = [
    mod_id                   : modId,
    mod_name                 : root.property('mod_name'),
    mod_version              : root.property('mod_version'),
    mod_license              : root.property('mod_license'),
    mod_authors              : root.property('mod_authors'),
    mod_description          : root.property('mod_description'),
    minecraft_version        : root.fabric_minecraft_range,
    java_version             : root.java_version,
    fabric_loader_min_version: root.property('fabric_loader_min_version')
]

processResources {
    inputs.properties(resourceProperties)
    filesMatching('fabric.mod.json') {
        expand resourceProperties
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-fabric"
            from components.java
        }
    }
}
