plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev'
}

def root = rootProject
def modId = root.property('mod_id')
def apiLayer = root.api_layer

base {
    archivesName = "${modId}-neoforge"
}

sourceSets {
    compatStub {
        java.srcDir root.file("common/src/compatStub_${apiLayer}/java")
    }
}

sourceSets.main.java.srcDir root.file('common/src/main/java')
if (apiLayer.startsWith('v26')) {
    sourceSets.main.java.srcDir root.file('common/src/v26/java')
    sourceSets.main.resources.srcDir root.file('common/src/v26/resources')
    sourceSets.main.java.srcDir file('src/v26/java')
    sourceSets.main.resources.srcDir file('src/v26/resources')
}
sourceSets.main.java.srcDir root.file("common/src/${apiLayer}/java")
sourceSets.main.resources.srcDir root.file('common/src/main/resources')
sourceSets.main.resources.srcDir root.file("common/src/${apiLayer}/resources")
sourceSets.main.java.srcDir file("src/${apiLayer}/java")
sourceSets.main.resources.srcDir file("src/${apiLayer}/resources")
sourceSets.main.compileClasspath += sourceSets.compatStub.output

sourceSets.test.java.srcDir root.file('common/src/test/java')
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath + sourceSets.compatStub.output
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.compatStub.output

sourceSets.main.resources.srcDir tasks.register('generateModMetadata', ProcessResources) {
    def replaceProperties = [
        minecraft_version_range: root.minecraft_version_range,
        neo_version_range      : root.neo_version_range,
        loader_version_range   : root.property('loader_version_range'),
        mod_id                 : modId,
        mod_name               : root.property('mod_name'),
        mod_license            : root.property('mod_license'),
        mod_version            : root.property('mod_version'),
        mod_authors            : root.property('mod_authors'),
        mod_description        : root.property('mod_description'),
        icon_property          : root.minecraft_version in ['26.2', '26.3'] ? 'iconFile' : 'logoFile'
    ]
    inputs.properties replaceProperties
    filteringCharset = 'UTF-8'
    expand replaceProperties
    from 'src/main/templates'
    into layout.buildDirectory.dir('generated/sources/modMetadata')
}

neoForge {
    version = root.neo_version
    mods {
        "${modId}" {
            sourceSet(sourceSets.main)
        }
    }
    unitTest {
        enable()
        testedMod = mods."${modId}"
    }
    runs {
        client { client() }
        server {
            server()
            programArgument '--nogui'
        }
        configureEach {
            logLevel = org.slf4j.event.Level.INFO
        }
    }
}

neoForge.ideSyncTask tasks.named('generateModMetadata')

dependencies {
    if (apiLayer == 'v121') {
        compileOnly 'com.bawnorton.mixinsquared:mixinsquared-common:0.2.0'
    }
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

sourceSets.compatStub.compileClasspath = configurations.compileClasspath

def jarArchiveFile = tasks.named('jar').flatMap { it.archiveFile }
def releasesDirPath = rootProject.layout.projectDirectory.dir('build/releases').asFile.absolutePath

tasks.named('test', Test) {
    dependsOn tasks.named('jar')
    useJUnitPlatform()
    doFirst {
        systemProperty 'tapetum.packagedJar', jarArchiveFile.get().asFile.absolutePath
        systemProperty 'tapetum.releasesDir', releasesDirPath
        systemProperty 'tapetum.apiLayer', apiLayer
        def reqAll = findProperty('requireAllReleases') ?: System.getProperty('tapetum.requireAllReleases')
        if (reqAll != null) {
            systemProperty 'tapetum.requireAllReleases', reqAll.toString()
        }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId = "${modId}-neoforge"
            from components.java
        }
    }
}
